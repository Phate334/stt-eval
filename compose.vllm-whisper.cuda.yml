services:
  vllm:
    image: vllm/vllm-openai:v0.21.0
    ipc: host
    ports:
      - "8080:8080"
    environment:
      MODEL_ID: "${MODEL_ID:-MediaTek-Research/Breeze-ASR-26}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-breeze-asr-26}"
      DTYPE: "${DTYPE:-float16}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - vllm-cache:/root/.cache
    command:
      - |
        set -eu
        exec vllm serve "$${MODEL_ID}" \
          --served-model-name "$${SERVED_MODEL_NAME}" \
          --host 0.0.0.0 \
          --port 8080 \
          --dtype "$${DTYPE}"
    devices:
      - "nvidia.com/gpu=all"

volumes:
  vllm-cache:
