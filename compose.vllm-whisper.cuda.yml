services:
  vllm:
    image: vllm/vllm-openai:v0.21.0
    ipc: host
    ports:
      - "8080:8080"
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - vllm-cache:/root/.cache
    command:
      - "${MODEL_ID:-MediaTek-Research/Breeze-ASR-26}"
      - --served-model-name
      - "${SERVED_MODEL_NAME:-breeze-asr-26}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --dtype
      - "${DTYPE:-float16}"
    devices:
      - "nvidia.com/gpu=all"

volumes:
  vllm-cache:
