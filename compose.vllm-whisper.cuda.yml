services:
  vllm:
    image: vllm/vllm-openai:v0.21.0
    restart: unless-stopped
    ipc: host
    ports:
      - "8080:8080"
    environment:
      MODEL_ID: "${MODEL_ID:-openai/whisper-large-v3}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-whisper-1}"
      DTYPE: "${DTYPE:-float16}"
      HF_HOME: "/root/.cache/huggingface"
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_ENABLE_CUDA_COMPATIBILITY: "${VLLM_ENABLE_CUDA_COMPATIBILITY:-1}"
    volumes:
      - vllm-cache:/root/.cache
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        exec vllm serve "$${MODEL_ID}" \
          --served-model-name "$${SERVED_MODEL_NAME}" \
          --host 0.0.0.0 \
          --port 8080 \
          --dtype "$${DTYPE}"
    devices:
      - "nvidia.com/gpu=all"

volumes:
  vllm-cache:
