services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      MODEL_NAME: "${MODEL_NAME:-whisper-1}"
      MODEL_ID: "${MODEL_ID:-phate334/Breeze-ASR-26-int8-CT2}"
      HF_HOME: "/home/ubuntu/.cache/huggingface"
      HF_TOKEN: "${HF_TOKEN:-}"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
    volumes:
      - speaches-cache:/home/ubuntu/.cache
    entrypoint:
      - /bin/sh
      - -lc
    command: |
      cat > /home/ubuntu/speaches/model_aliases.json <<EOF
      {
        "$${MODEL_NAME}": "$${MODEL_ID}"
      }
      EOF
      exec uvicorn --factory speaches.main:create_app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  speaches-cache:
