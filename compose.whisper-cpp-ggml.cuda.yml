services:
  download:
    image: ubuntu:24.04
    restart: "no"
    volumes:
      - whisper-cpp-ggml-models:/models
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl
        rm -rf /var/lib/apt/lists/*

        url="https://huggingface.co/${HF_MODEL_REPO:-phate334/Breeze-ASR-26-GGML}/resolve/main/${MODEL_FILE:-ggml-model-q4_0.bin}"
        if [ -n "${HF_TOKEN:-}" ]; then
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer ${HF_TOKEN:-}" \
            --output "/models/${MODEL_FILE:-ggml-model-q4_0.bin}" \
            "$$url"
        else
          curl --fail --location --retry 3 \
            --output "/models/${MODEL_FILE:-ggml-model-q4_0.bin}" \
            "$$url"
        fi

  whisper-cpp:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda-afa2ea544fb4b0448916b4a31ecd33c8685bd482
    restart: unless-stopped
    depends_on:
      download:
        condition: service_completed_successfully
    environment:
      # Workaround: prefer host NVIDIA driver libs over CUDA compat libcuda.so.1
      LD_LIBRARY_PATH: "/lib/x86_64-linux-gnu:/usr/local/cuda/lib64:/usr/local/cuda/targets/x86_64-linux/lib"
    ports:
      - "8080:8080"
    volumes:
      - whisper-cpp-ggml-models:/models:ro
    command:
      - |
        set -eu
        exec whisper-server \
          --host 0.0.0.0 \
          --port 8080 \
          --model "/models/${MODEL_FILE:-ggml-model-q4_0.bin}" \
          --threads "${THREADS:-4}" \
          --processors "${PROCESSORS:-1}" \
          --language "${LANGUAGE:-auto}" \
          --convert \
          --request-path /v1/audio/transcriptions \
          --inference-path ""
    devices:
      - "nvidia.com/gpu=all"

volumes:
  whisper-cpp-ggml-models:
